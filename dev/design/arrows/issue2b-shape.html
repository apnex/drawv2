<text x="20" y="32" fill="#e0e0e0" font-size="20">Arrowhead shape -- mockups for H24.6 (B356)</text>
<text x="20" y="56" fill="#9e9e9e" font-size="12">Placement (H24.6-1): lines run to the centre, the tip on the outline. Size (H24.6-2): 4 line widths, never under 18 px -- 24 on data, 18 on control.</text>
<text x="20" y="74" fill="#9e9e9e" font-size="12">Hollow heads outlined at 2 px (a device frame's weight) or 4 px; the outline's outer edge, not its centre, touches the anchor's outline.</text>
