<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="monospace"><rect x="0" y="0" width="760" height="420" fill="#0d0d0d"/><g stroke="#1c1c1c" stroke-width="1"><line x1="60" y1="0" x2="60" y2="420"/><line x1="120" y1="0" x2="120" y2="420"/><line x1="180" y1="0" x2="180" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/><line x1="360" y1="0" x2="360" y2="420"/><line x1="420" y1="0" x2="420" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="540" y1="0" x2="540" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="660" y1="0" x2="660" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="0" y1="60" x2="760" y2="60"/><line x1="0" y1="120" x2="760" y2="120"/><line x1="0" y1="180" x2="760" y2="180"/><line x1="0" y1="240" x2="760" y2="240"/><line x1="0" y1="300" x2="760" y2="300"/><line x1="0" y1="360" x2="760" y2="360"/></g><g><rect x="100" y="100" width="160" height="40" rx="5" fill="#101010" stroke="#aed581" stroke-width="1.6"/><rect x="167" y="113" width="26" height="14" fill="none" stroke="#e0a85a" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.35"/><text x="180" y="125" text-anchor="middle" font-size="15" fill="#e6e6e6">Diagram title</text><text x="180" y="166" text-anchor="middle" font-size="11" fill="#7a7a7a">(1) TEXT  node.content='text'  (3 cells, auto-grown)</text></g><g><rect x="460" y="100" width="100" height="40" rx="5" fill="#10303c" stroke="#4fc3f7" stroke-width="2.1"/><text x="510" y="125" text-anchor="middle" font-size="15" fill="#cdeefb">Export</text><g fill="none" stroke="#4fc3f7" stroke-width="2"><path d="M457,107 L457,97 L467,97"/><path d="M553,97 L563,97 L563,107"/><path d="M563,133 L563,143 L553,143"/><path d="M467,143 L457,143 L457,133"/></g><text x="510" y="166" text-anchor="middle" font-size="11" fill="#7a7a7a">(2) BUTTON  content='button'  (selects as a node)</text></g><g><rect x="100" y="220" width="260" height="40" rx="5" fill="#101010" stroke="#aed581" stroke-width="1.6"/><text x="116" y="245" font-size="15" fill="#e6e6e6">Name:</text><rect x="180" y="226" width="168" height="28" rx="4" fill="#0d0d0d" stroke="#aed581" stroke-width="1.4" stroke-opacity="0.5"/><text x="192" y="245" font-size="15" fill="#aed581">web-tier</text><line x1="268" y1="230" x2="268" y2="250" stroke="#4fc3f7" stroke-width="1.5"/><text x="230" y="288" text-anchor="middle" font-size="11" fill="#7a7a7a">(3) INPUT  content='input'  label + nested value slot</text></g><g><rect x="94" y="334" width="532" height="52" rx="11" fill="none" stroke="#b388ff" stroke-width="1.1"/><rect x="100" y="340" width="100" height="40" rx="5" fill="#101010" stroke="#aed581" stroke-width="1.6"/><text x="150" y="365" text-anchor="middle" font-size="15" fill="#e6e6e6">Filters</text><rect x="220" y="340" width="160" height="40" rx="5" fill="#101010" stroke="#aed581" stroke-width="1.6"/><text x="234" y="365" font-size="15" fill="#e6e6e6">Name:</text><rect x="288" y="346" width="84" height="28" rx="4" fill="#0d0d0d" stroke="#aed581" stroke-width="1.4" stroke-opacity="0.5"/><text x="296" y="365" font-size="15" fill="#aed581">web-tier</text><rect x="400" y="340" width="100" height="40" rx="5" fill="#10303c" stroke="#4fc3f7" stroke-width="2.1"/><text x="450" y="365" text-anchor="middle" font-size="15" fill="#cdeefb">Apply</text><rect x="520" y="340" width="100" height="40" rx="5" fill="#10303c" stroke="#4fc3f7" stroke-width="2.1"/><text x="570" y="365" text-anchor="middle" font-size="15" fill="#cdeefb">Reset</text><text x="360" y="406" text-anchor="middle" font-size="11" fill="#7a7a7a">(4) CONTROL BAR  text + input + 2 buttons on consecutive cells, group-bound = a diagram</text></g></svg>