<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace"><rect x="0" y="0" width="760" height="420" fill="#0d0d0d"/><g stroke="#1c1c1c" stroke-width="1"><line x1="60" y1="0" x2="60" y2="420"/><line x1="120" y1="0" x2="120" y2="420"/><line x1="180" y1="0" x2="180" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/><line x1="360" y1="0" x2="360" y2="420"/><line x1="420" y1="0" x2="420" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="540" y1="0" x2="540" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="660" y1="0" x2="660" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="0" y1="60" x2="760" y2="60"/><line x1="0" y1="120" x2="760" y2="120"/><line x1="0" y1="180" x2="760" y2="180"/><line x1="0" y1="240" x2="760" y2="240"/><line x1="0" y1="300" x2="760" y2="300"/><line x1="0" y1="360" x2="760" y2="360"/></g><text x="20" y="26" fill="#aaa" font-size="13">Approach C — one KIND: a multi-cell text-node (a node is the 1x1 case)</text><!-- (1) TEXT BOX: cols1..3 row1, frame hidden --><rect x="40" y="40" width="160" height="40" rx="5" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="3 3"/><text x="120" y="60" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">Diagram title</text><text x="120" y="100" fill="#888" font-size="11" text-anchor="middle">(1) TEXT BOX  role=label (frame hidden)</text><!-- N=1 degenerate = a node-square --><rect x="280" y="40" width="40" height="40" rx="5" fill="#101010" stroke="#aed581" stroke-width="2.1"/><rect x="287" y="47" width="26" height="26" fill="none" stroke="#e0a85a" stroke-width="0.6" stroke-dasharray="2 2"/><text x="300" y="100" fill="#888" font-size="11" text-anchor="middle">= 1x1 (a node)</text><!-- (2) BUTTON: cols6..7 row2 --><rect x="340" y="100" width="100" height="40" rx="5" fill="#16202a" stroke="#4fc3f7" stroke-width="2.1"/><text x="390" y="120" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">Export</text><text x="390" y="162" fill="#888" font-size="11" text-anchor="middle">(2) BUTTON  role=button</text><!-- (3) INPUT: cols9..12 row2, label + slot --><rect x="520" y="100" width="220" height="40" rx="5" fill="#141414" stroke="#2b2b2b" stroke-width="1.4"/><text x="532" y="120" fill="#9aa0a6" font-size="15" text-anchor="start" dominant-baseline="central">Name:</text><rect x="600" y="106" width="130" height="28" rx="3" fill="#0d0d0d" stroke="#aed581" stroke-width="2"/><text x="665" y="120" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">web-tier</text><text x="630" y="162" fill="#888" font-size="11" text-anchor="middle">(3) INPUT  role=input (label + editable slot)</text><!-- (4) CONTROL BAR: cols1..12 row5 backplane + child widgets on its cells --><rect x="40" y="280" width="700" height="40" rx="5" fill="#141414" stroke="#2b2b2b" stroke-width="1.4"/><text x="90" y="300" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">draw</text><text x="172" y="300" fill="#9aa0a6" font-size="15" text-anchor="start" dominant-baseline="central">file:</text><rect x="240" y="286" width="110" height="28" rx="3" fill="#0d0d0d" stroke="#aed581" stroke-width="2"/><text x="295" y="300" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">scene</text><rect x="466" y="286" width="88" height="28" rx="4" fill="#16202a" stroke="#4fc3f7" stroke-width="2"/><text x="510" y="300" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">Save</text><rect x="586" y="286" width="88" height="28" rx="4" fill="#16202a" stroke="#4fc3f7" stroke-width="2"/><text x="630" y="300" fill="#e8e8e8" font-size="15" text-anchor="middle" dominant-baseline="central">Export</text><text x="390" y="345" fill="#888" font-size="11" text-anchor="middle">(4) CONTROL BAR  role=bar backplane + child text-nodes placed on its cells (diagram-as-UI)</text></svg>